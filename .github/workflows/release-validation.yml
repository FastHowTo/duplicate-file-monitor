name: Validate release candidate
on:
  push:
    branches: ['release/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify Python syntax
        run: python -m compileall -q app tests
      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('app/index.html').read_text()
          script=html.split('<script>')[-1].split('</script>')[0]
          Path('/tmp/dfm-check.js').write_text(script)
          PY
          node --check /tmp/dfm-check.js
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Run regression tests
        run: python -m pytest -q tests
      - name: Build image
        run: docker build -t dfm:release-candidate .
