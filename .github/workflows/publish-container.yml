name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install browser for UI tests
        run: python -m playwright install --with-deps chromium
      - name: Verify Python and JavaScript syntax
        run: |
          python -m compileall -q app tests
          python - <<'PY'
          from pathlib import Path
          html=Path('app/index.html').read_text()
          Path('/tmp/dfm-check.js').write_text(html.split('<script>')[-1].split('</script>')[0])
          PY
          node --check /tmp/dfm-check.js
      - name: Run all tests before publishing
        run: python -m pytest -q tests
      - name: Check source version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import ast; p=ast.parse(open("app/version.py").read()); print(next(n.value.value for n in p.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=="VERSION" for t in n.targets)))')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate with GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Create or retain matching GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Duplicate File Monitor $TAG" \
              --notes-file "RELEASE_NOTES_${{ steps.version.outputs.version }}.md" \
              --latest
          fi
