<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DFM · Sign in</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;color-scheme:dark;background:#0b1220;color:#eaf0f9}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(470px,100%);background:#151f30;border:1px solid #354963;border-radius:12px;padding:32px}
h1{font-size:1.5rem;margin:0 0 8px}p{color:#b4c9df;line-height:1.55}label{display:block;margin-top:16px;font-size:.9rem}
input{width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border:1px solid #4a607e;border-radius:7px;color:white;background:#0b1220;font:inherit}
button{margin-top:22px;width:100%;padding:12px;background:#3979e6;border:0;border-radius:7px;color:white;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}#error{color:#ff9898;min-height:1.3em;margin-top:12px}
</style></head><body><main>
<h1>Duplicate File Monitor</h1><p id="subtitle">Checking authentication…</p>
<form id="login-form" hidden>
<label>Username<input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32"></label>
<label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
<div id="setup-fields" hidden><label>One-time setup token<input id="token" name="setup-token" type="password" autocomplete="off"></label></div>
<button id="submit" type="submit">Sign in</button></form>
<p id="error" role="alert"></p>
</main><script>
'use strict';
const el=id=>document.getElementById(id);
let setup=false;
async function initialize(){
 try{
  const r=await fetch('/api/auth/status',{cache:'no-store'});
  const s=await r.json();
  if(s.authenticated){location.replace('/');return}
  setup=!!s.setup_required;
  el('subtitle').textContent=setup?'First-time administrator setup. Set a unique username and a strong password. Enter the one-time DFM_SETUP_TOKEN from your private Docker configuration.':'Sign in to access the dashboard and scan reports.';
  el('login-form').hidden=false;el('setup-fields').hidden=!setup;
  el('password').autocomplete=setup?'new-password':'current-password';
  el('submit').textContent=setup?'Create administrator':'Sign in';
  if(setup&&!s.setup_configured)el('error').textContent='DFM_SETUP_TOKEN must be set in your private Compose environment (24+ random characters) before setup.';
 }catch(e){el('error').textContent='Unable to reach DFM: '+e.message}
}
el('login-form').addEventListener('submit',async e=>{
 e.preventDefault();el('error').textContent='';el('submit').disabled=true;
 try{
  const payload={username:el('username').value,password:el('password').value};
  if(setup)payload.setup_token=el('token').value;
  const response=await fetch(setup?'/api/auth/setup':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await response.json();
  if(!response.ok)throw Error(data.error||'Authentication failed');
  location.replace('/');
 }catch(err){el('error').textContent=err.message;el('submit').disabled=false}
});
initialize();
</script></body></html>
